spring:
  application:
    name: backend
  config:
    import: application-secret.yml
  datasource:
    url: jdbc:mysql://localhost:3306/pharm_erp?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway 마이그레이션(db/migration)으로 관리, 엔티티와 불일치 시 실행 실패
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul   # DB 시간 저장 기준: KST (JDBC URL, Docker TZ와 동일)
        type:
          preferred_instant_jdbc_type: TIMESTAMP   # Instant도 위 time_zone(KST) 기준으로 저장 (기본값은 UTC로 저장)
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE   # API 명세서 필드명(snake_case)과 일치 (예: request_id, page_size)
    mapper:
      sort-properties-alphabetically: false   # 응답 필드를 선언 순서(success, data, pagination, meta)대로 출력

server:
  port: 8080

jwt:
  expiration: 3600000   # 1시간 (ms 단위)
  refresh-expiration: 1209600000   # refresh token 14일 (ms 단위)